<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 260" role="img" aria-label="Studio Eef — schilderwerken">
  <!--
    Studio EEF — logo v2 ("Verse verf")
    Evolutie van het balkenlogo: de EEF-verfstalen blijven, nu mét één
    vloeiende mosterd kwastveeg door het teken (achter de balken) en één
    roze druppel als knipoog. De olijf-op-inkt-zwakte uit v1 (de F-stam)
    is opgelost: kritieke delen zijn mosterd/roze/kalkwit op inkt.
    Wordmark "Studio Eef": breed, zwaar, geometrisch — geen script.
    Volledig zelfstandige vectoren (geen fontafhankelijkheid).
  -->
  <defs>
    <!-- lichte kwastbristle op de veeg: subtiel, horizontaal gestrekt -->
    <filter id="veegrand" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.09" numOctaves="2" seed="7" result="ruis"/>
      <feDisplacementMap in="SourceGraphic" in2="ruis" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- ===== MERKTEGEL: EEF als verfstalen + kwastveeg ===== -->
  <g>
    <rect x="0" y="10" width="240" height="240" rx="30" fill="#231F20"/>

    <!-- kwastveeg: mosterd op inkt — één vloeiende slag, achter de balken -->
    <g filter="url(#veegrand)">
      <path d="M 4 208 C 62 166, 132 110, 230 16 L 236 22 C 148 132, 86 180, 22 228 Z" fill="#D6AF29"/>
      <!-- dunne nasleep-haar van dezelfde slag -->
      <path d="M 18 240 C 80 198, 150 142, 234 46" fill="none" stroke="#D6AF29" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
    </g>

    <!-- E — drie verfstalen: mosterd / olijf (kalkwit gerand) / roze -->
    <g>
      <rect x="28" y="66" width="52" height="24" rx="12" fill="#D6AF29"/>
      <rect x="28" y="108" width="40" height="24" rx="12" fill="#424631" stroke="#F1EDE4" stroke-width="2.5"/>
      <rect x="28" y="150" width="52" height="24" rx="12" fill="#F37C96"/>
    </g>

    <!-- E — herhaling van het motief -->
    <g>
      <rect x="98" y="66" width="52" height="24" rx="12" fill="#D6AF29"/>
      <rect x="98" y="108" width="40" height="24" rx="12" fill="#424631" stroke="#F1EDE4" stroke-width="2.5"/>
      <rect x="98" y="150" width="52" height="24" rx="12" fill="#F37C96"/>
    </g>

    <!-- F — stam nu kalkwit i.p.v. olijf: leesbaar op inkt -->
    <g>
      <rect x="168" y="108" width="24" height="66" rx="12" fill="#F1EDE4"/>
      <rect x="168" y="66" width="52" height="24" rx="12" fill="#D6AF29"/>
      <rect x="192" y="108" width="28" height="24" rx="12" fill="#424631" stroke="#F1EDE4" stroke-width="2.5"/>
    </g>

    <!-- één roze druppel, hangend onder de veeg -->
    <path d="M 88 152 c -6 9 -9 15 -4 21 c 4 5 12 3 13 -3 c 1 -6 -3 -12 -9 -18 z" fill="#F37C96"/>
  </g>

  <!-- ===== WORDMARK: Studio Eef — breed, zwaar, geometrisch ===== -->
  <g fill="none" stroke="#231F20" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- S -->
    <path d="M 346 106 C 340 92 306 90 300 106 C 295 120 306 130 327 134 C 348 138 352 152 346 166 C 340 180 306 178 298 168"/>
    <!-- t -->
    <path d="M 392 116 C 390 102 378 100 374 110"/>
    <path d="M 376 108 L 376 188"/>
    <path d="M 360 138 L 396 138"/>
    <!-- u -->
    <path d="M 414 116 L 414 176 C 414 190 426 194 440 190 C 450 187 456 178 456 168 L 456 116"/>
    <!-- d -->
    <path d="M 516 188 C 492 188 480 170 480 151 C 480 132 492 114 516 114 C 524 114 532 118 536 126"/>
    <path d="M 526 104 L 526 188"/>
    <!-- i -->
    <path d="M 556 116 L 556 188"/>
    <circle cx="556" cy="98" r="9" fill="#231F20" stroke="none"/>
    <!-- o -->
    <path d="M 610 114 C 592 114 582 130 582 151 C 582 170 592 188 610 188 C 628 188 638 170 638 151 C 638 130 628 114 610 114"/>
    <!-- E — echo van het balkenmotief; ruime woordspatie na "Studio" -->
    <path d="M 742 88 L 690 88 L 690 188 L 742 188"/>
    <path d="M 690 138 L 738 138"/>
    <!-- e — korte exit-staart, los van de f (klein-formaat-veilig) -->
    <path d="M 834 152 L 790 152 C 781 152 777 144 777 137 C 777 126 787 116 806 116 C 820 116 831 122 834 132 C 837 144 830 160 814 168 C 804 173 794 172 788 167"/>
    <!-- f — extra tussenruimte na de e, rustige haak -->
    <path d="M 920 128 C 918 112 902 104 896 118 C 893 125 893 138 893 150 L 893 188"/>
    <path d="M 877 150 L 913 150"/>
  </g>
</svg>
