<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Studio Eef">
  <!--
    Studio EEF — favicon v2: kwastveeg-E op inkt-tegel.
    Zelfde bouw als het grote logo: boven- en onderbalk mosterd,
    het midden is de kwastveeg, met één roze druppel.
    Geen olijf op inkt (te weinig contrast op 16px), geen filter
    (bristle-displacement wordt ruis op klein formaat).
  -->
  <rect width="64" height="64" rx="14" fill="#231F20"/>

  <!-- bovenbalk -->
  <rect x="13" y="13" width="38" height="9" rx="4.5" fill="#D6AF29"/>

  <!-- kwastveeg als middenstreep: licht taps aflopend, met wave -->
  <path d="M 13 30.5 C 24 27.5, 36 28.5, 51 25.5 C 51.5 29, 48.5 32, 44 33 C 32 35.5, 20 34.5, 13 34 Z" fill="#D6AF29"/>

  <!-- onderbalk -->
  <rect x="13" y="42" width="38" height="9" rx="4.5" fill="#D6AF29"/>

  <!-- één roze druppel onder de veeg -->
  <path d="M 46.5 34.5 c -2.5 3 -3.5 5 -1.5 7.5 c 2 2 5.5 1 5.5 -2 c 0 -2 -1.5 -4 -4 -5.5 z" fill="#F37C96"/>
</svg>
